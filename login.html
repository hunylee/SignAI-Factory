<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - SignAI-Factory</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .login-box p.subtitle {
            text-align: center;
            color: #636e72;
            margin-bottom: 25px;
        }

        /* 소셜 로그인 버튼 */
        .social-login {
            margin-bottom: 25px;
        }

        .social-btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .social-btn:hover {
            transform: translateY(-2px);
        }

        .social-btn img {
            width: 22px;
            height: 22px;
        }

        /* Google 버튼 */
        .social-btn.google {
            background: #ffffff;
            border: 2px solid #e8e8e8;
            color: #333;
        }

        .social-btn.google:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Naver 버튼 */
        .social-btn.naver {
            background: #03C75A;
            color: white;
        }

        .social-btn.naver:hover {
            box-shadow: 0 4px 15px rgba(3, 199, 90, 0.4);
        }

        /* Kakao 버튼 */
        .social-btn.kakao {
            background: #FEE500;
            color: #191919;
        }

        .social-btn.kakao:hover {
            box-shadow: 0 4px 15px rgba(254, 229, 0, 0.5);
        }

        /* 구분선 */
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #b2bec3;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e8e8e8;
        }

        .divider span {
            padding: 0 15px;
        }

        .login-box .form-group {
            margin-bottom: 20px;
        }

        .login-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2d3436;
        }

        .login-box input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .login-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-box .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-box .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .error-message {
            background: #ffe6e6;
            color: #e74c3c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
        }

        .admin-notice {
            background: #fff8e7;
            border: 1px solid #ffeaa7;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #636e72;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🤟 로그인</h1>
            <p class="subtitle">SignAI-Factory에 오신 것을 환영합니다</p>

            <!-- 소셜 로그인 버튼 -->
            <div class="social-login">
                <button class="social-btn google" onclick="socialLogin('google')">
                    <svg width="22" height="22" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Google로 계속하기
                </button>

                <button class="social-btn naver" onclick="socialLogin('naver')">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
                        <path d="M16.273 12.845L7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727z" />
                    </svg>
                    네이버로 계속하기
                </button>

                <button class="social-btn kakao" onclick="socialLogin('kakao')">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="#191919">
                        <path
                            d="M12 3C6.477 3 2 6.477 2 10.5c0 2.47 1.607 4.647 4.023 5.9-.158.572-.512 2.07-.587 2.39-.093.404.148.398.312.29.129-.086 2.052-1.39 2.883-1.955.449.065.91.1 1.369.1 5.523 0 10-3.477 10-7.725C22 6.477 17.523 3 12 3z" />
                    </svg>
                    카카오로 계속하기
                </button>
            </div>

            <div class="divider"><span>또는 이메일로 로그인</span></div>

            <div class="admin-notice">
                🔐 관리자 로그인은 이메일/비밀번호를 사용하세요
            </div>

            <div class="error-message" id="error-message"></div>

            <form id="login-form">
                <div class="form-group">
                    <label>이메일</label>
                    <input type="email" id="email" placeholder="admin@signai.kr" required>
                </div>

                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="password" placeholder="비밀번호 입력" required>
                </div>

                <button type="submit" class="submit-btn">로그인</button>
            </form>

            <a href="/" class="back-link">← 메인으로 돌아가기</a>
            <p style="text-align: center; margin-top: 15px; color: #636e72; font-size: 14px;">
                계정이 없으신가요? <a href="/signup.html" style="color: #667eea; font-weight: 600;">회원가입</a>
            </p>
        </div>
    </div>

    <script>
        // 이미 로그인되어 있으면 관리자 페이지로 이동
        if (localStorage.getItem('adminToken')) {
            window.location.href = '/admin';
        }

        // 소셜 로그인 처리
        function socialLogin(provider) {
            // API 키가 설정되어 있는지 확인
            const isConfigured = false; // TODO: 실제 API 키 설정 후 true로 변경

            if (!isConfigured) {
                alert(`⚙️ ${provider.toUpperCase()} 로그인 준비 중입니다.\n\nAPI 키 설정 후 사용 가능합니다.\n\n설정 방법:\n1. config/oauth.js 파일 수정\n2. ${provider} API 키 입력`);
                return;
            }

            // 실제 OAuth URL로 리다이렉트
            window.location.href = `/api/auth/${provider}`;
        }

        // 이메일 로그인 처리
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    // 토큰 저장
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminUser', JSON.stringify(data.user));

                    // 관리자인지 확인
                    if (data.user.role === 'admin') {
                        alert('🎉 로그인 성공! 관리자 페이지로 이동합니다.');
                        window.location.href = '/admin';
                    } else {
                        errorDiv.textContent = '관리자 권한이 없습니다.';
                        errorDiv.style.display = 'block';
                        localStorage.removeItem('adminToken');
                        localStorage.removeItem('adminUser');
                    }
                } else {
                    errorDiv.textContent = data.error;
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = '서버 연결에 실패했습니다.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
